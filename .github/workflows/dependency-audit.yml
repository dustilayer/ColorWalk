name: Dependency Audit

on:
  schedule:
    # 每周一 UTC 03:00(北京时间 11:00)跑一次
    - cron: '0 3 * * 1'
  workflow_dispatch:
    # 允许手动触发用于测试

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run npm audit
        id: audit
        run: |
          echo "Running npm audit..."
          # 只检查 high 和 critical 级别,避免噪音
          if npm audit --audit-level=high --json > audit-result.json 2>&1; then
            echo "No high or critical vulnerabilities found."
            echo "has_vulns=false" >> $GITHUB_OUTPUT
          else
            echo "Vulnerabilities detected."
            echo "has_vulns=true" >> $GITHUB_OUTPUT
          fi

      - name: Create issue if vulnerabilities found
        if: steps.audit.outputs.has_vulns == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let auditOutput;
            try {
              auditOutput = fs.readFileSync('audit-result.json', 'utf8');
            } catch (e) {
              auditOutput = 'Could not read audit output.';
            }

            const title = `[Security] npm audit found high/critical vulnerabilities (${new Date().toISOString().split('T')[0]})`;
            const body = `## Automated dependency audit found vulnerabilities

            Run \`npm audit\` locally to see details and \`npm audit fix\` to attempt automatic fixes.

            ### Audit Output (truncated)

            \`\`\`json
            ${auditOutput.substring(0, 3000)}
            \`\`\`

            ---
            *This issue was automatically created by .github/workflows/dependency-audit.yml*
            *Triggered: ${new Date().toISOString()}*`;

            // 检查是否已存在相同 title 的 open issue,避免重复刷
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security,automated'
            });

            const todayDate = new Date().toISOString().split('T')[0];
            const duplicate = existing.data.find(i => i.title.includes(todayDate));
            if (duplicate) {
              console.log('Issue for today already exists:', duplicate.html_url);
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['security', 'automated']
            });
