<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- ColorWalk App Icon -->
  <!-- v1 layout (size-staggered 2×2 with dashed empty tile) -->
  <!-- Palette 7: harmonized mid-tone (calibrated from generic web colors) -->

  <!-- Background: moon white -->
  <rect width="1024" height="1024" fill="#F5F0E8"/>

  <!-- Top-left: warm red (large), color 绛 -->
  <rect x="200" y="200" width="290" height="290" rx="44" fill="#C8443D"/>

  <!-- Top-right: amber (small), color 缃 -->
  <rect x="565" y="240" width="235" height="235" rx="33" fill="#E08B49"/>

  <!-- Bottom-left: deep teal (small), color 霁青 -->
  <rect x="220" y="580" width="220" height="220" rx="29" fill="#3A7D71"/>

  <!-- Bottom-right: dashed empty (large), the "tile to collect" -->
  <rect x="530" y="545" width="290" height="290" rx="44" fill="none" stroke="#1A1714" stroke-width="8" stroke-dasharray="18 11"/>
</svg>
